name: Internal offline reporting
on:
  pull_request:
    branches: [internal]
    paths:
      - 'TOOLS/sarif_export.py'
      - 'TOOLS/privacy_guard.py'
      - 'TOOLS/vibe_core.py'
      - 'tests/test_internal_reporting.py'
      - '.github/workflows/internal-reporting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-reporting:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_internal_reporting.py' -v
