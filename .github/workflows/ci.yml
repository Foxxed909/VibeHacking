name: CI

on:
  push:
    branches: [main, internal]
  pull_request:

jobs:
  smoke:
    name: Smoke tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      # The toolkit is standard-library only, so there is nothing to install.
      - name: Build the Go load tester
        working-directory: TOOLS/maelstrom
        run: go build ./...

      - name: Run smoke tests
        run: python tests/smoke_test.py

  novachat:
    name: Practice-target end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start NovaChat, confirm tools land real findings, stop it
        run: |
          set -euo pipefail
          python testapp/app.py --port 3456 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          # wait for the target to come up
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:3456/; then break; fi
            sleep 0.5
          done

          # Capture to files first, then assert. Piping tool output straight
          # into `grep -q` makes grep close the pipe early, which crashes the
          # tool with BrokenPipeError and (under pipefail) fails the step.
          python TOOLS/vibe_headers.py --url http://127.0.0.1:3456/ > headers.txt
          python TOOLS/exploit_final.py --url http://127.0.0.1:3456/api/guestbook \
            --field text --check-url http://127.0.0.1:3456/ > xss.txt || true
          python TOOLS/key_stealer.py --url http://127.0.0.1:3456/ > keys.txt
          # These two only pass if the tools require real evidence: the traversal
          # must return file content and the SSRF must post the field the target reads.
          python TOOLS/traversal_sniper.py --url http://127.0.0.1:3456/ > traversal.txt
          python TOOLS/ssrf_probe.py --url http://127.0.0.1:3456/ > ssrf.txt
          python TOOLS/biz_logic.py --url http://127.0.0.1:3456/ > bizlogic.txt

          grep -q "MISSING: Content-Security-Policy" headers.txt
          grep -q "CONFIRMED XSS" xss.txt
          grep -q "KEY CANDIDATE" keys.txt
          grep -q "TRAVERSAL CONFIRMED" traversal.txt
          grep -q "SSRF HIT" ssrf.txt
          grep -q "IDOR" bizlogic.txt

          echo "Practice-target end-to-end checks passed."
