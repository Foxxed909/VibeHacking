name: Offline reporting and metadata

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'pyproject.toml'
      - 'TOOLS/sarif_export.py'
      - 'TOOLS/vibe_core.py'
      - 'TOOLS/privacy_guard.py'
      - 'tests/test_reporting_maintenance.py'
      - '.github/workflows/reporting-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reporting:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p 'test_reporting_maintenance.py' -v
